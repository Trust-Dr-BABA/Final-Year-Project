<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Analyst</title>
    <!-- External and blocking (not type=module, so it runs before paint) — an inline <script> would
       be silently blocked by manifest.json's CSP (script-src 'self' has no 'unsafe-inline'). -->
    <script src="theme_init.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <header class="popup-header">
        <span class="logo">ESA</span>
        <div class="header-right">
          <button
            class="theme-toggle"
            id="btn-theme-toggle"
            type="button"
            aria-label="Toggle light/dark theme"
          >
            <svg
              class="icon-sun"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="icon-moon"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- ── State: Scanning ─────────────────────────────────────── -->
      <div id="state-scanning" class="state hidden">
        <div class="spinner"></div>
        <p class="state-label">Analyzing page...</p>
      </div>

      <!-- ── State: Safe ────────────────────────────────────────────── -->
      <div id="state-safe" class="state hidden">
        <div class="verdict-icon safe-icon">✓</div>
        <h2 class="verdict-title safe-text">Page Looks Safe</h2>
        <p class="confidence-badge safe-badge" id="safe-confidence"></p>
      </div>

      <!-- ── State: Suspicious ─────────────────────────────────────── -->
      <div id="state-suspicious" class="state hidden">
        <div class="verdict-icon suspicious-icon">!</div>
        <h2 class="verdict-title suspicious-text">Proceed with Caution</h2>
        <p
          class="confidence-badge suspicious-badge"
          id="suspicious-confidence"
        ></p>
        <ul class="reasons-list" id="suspicious-reasons"></ul>
      </div>

      <!-- ── State: Phishing ───────────────────────────────────────── -->
      <div id="state-phishing" class="state hidden">
        <div class="verdict-icon phishing-icon">✕</div>
        <h2 class="verdict-title phishing-text">Phishing Detected</h2>
        <p class="confidence-badge phishing-badge" id="phishing-confidence"></p>
        <ul class="reasons-list" id="phishing-reasons"></ul>
      </div>

      <!-- ── State: Error ───────────────────────────────────────────── -->
      <div id="state-error" class="state hidden">
        <div class="verdict-icon error-icon">?</div>
        <h2 class="verdict-title error-text">Analysis Failed</h2>
        <p class="error-message" id="error-message"></p>
        <button class="btn-retry" id="btn-retry">Retry</button>
      </div>

      <!-- Footer -->
      <footer class="popup-footer">
        <a href="#" id="btn-dashboard">Open Dashboard</a>
      </footer>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>

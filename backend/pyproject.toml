[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-Powered Explainable Security & Privacy Analyst"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "greenlet==3.0.3",
    # Config
    "python-dotenv==1.0.1",
    # Feature extraction
    "tldextract==5.1.2",
    "httpx==0.27.0",
    # Caching
    "cachetools==5.3.3",
    # ml/shap_analysis.py imports these on the request path — not optional in a serving container
    "numpy<2",  # shap 0.45.0's compiled extensions use the NumPy 1.x C-API
    "pandas==2.2.2",
    "joblib==1.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.optional-dependencies]
ml = [
    "xgboost==2.0.3",
    "shap==0.45.0",
    "scikit-learn==1.4.2",
]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "black==24.4.2",
    "isort==5.13.2",
    "ruff==0.5.0",
]

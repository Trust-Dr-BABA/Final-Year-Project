[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-Powered Explainable Security & Privacy Analyst"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # ML
    "xgboost==2.0.3",
    "shap==0.45.0",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "joblib==1.4.2",
    # Feature extraction
    "tldextract==5.1.2",
    "httpx==0.27.0",
    # Caching
    "cachetools==5.3.3",
    # Utilities
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "black==24.4.2",
    "isort==5.13.2",
]

services:
  postgres:
    image: postgres:15-alpine
    container_name: fyp_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: fyp_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "8000:8000"
    volumes:
      - ../ml/models:/app/ml/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    container_name: fyp_dashboard
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../dashboard:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

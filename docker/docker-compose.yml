version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fyp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fyp_user
      POSTGRES_PASSWORD: fyp_password
      POSTGRES_DB: fyp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyp_user -d fyp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fyp_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://fyp_user:fyp_password@postgres:5432/fyp_db
    ports:
      - "8000:8000"
    volumes:
      - ../ml/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    container_name: fyp_dashboard
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../dashboard:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
